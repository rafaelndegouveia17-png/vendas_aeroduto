<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Vendas Aeroduto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #12161b;
            --panel: #1b222a;
            --panel-border: #2a323c;
            --text: #edeff2;
            --muted: #8891a0;
            --accent: #7c9cff;
            --danger: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 340px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 4px;
        }

        p.subtitulo {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 24px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 16px;
            font-family: 'Inter', sans-serif;
        }

        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: #12161b;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .erro {
            color: var(--danger);
            font-size: 13px;
            margin: -8px 0 16px;
        }
    </style>
</head>

<body>
    <form class="card" method="post">
        <h1>Vendas Aeroduto</h1>
        <p class="subtitulo">Acesso restrito — entre com seu usuário e senha.</p>
        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" required autofocus autocomplete="username">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password">
        <button type="submit">Entrar</button>
    </form>
</body>

</html>
